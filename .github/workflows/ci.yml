name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [ '1.22', '1.23' ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true

      - name: Check Formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go code is not formatted properly:"
            gofmt -d .
            exit 1
          fi

      - name: Go Vet
        run: go vet ./...

      - name: Run Tests
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Build Binary
        run: CGO_ENABLED=0 go build -ldflags="-w -s" -o csupa .

  deploy:
    name: Deploy to Dokploy
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Dokploy Webhook
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$DOKPLOY_WEBHOOK_URL" ]; then
            echo "::warning ::DOKPLOY_WEBHOOK_URL secret belum diset di GitHub Secrets. Melewati tahap deploy."
            exit 0
          fi
          echo "Mengirim trigger deployment ke Dokploy..."
          curl -s -S -X POST "$DOKPLOY_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            --fail \
            --show-error
          echo "Deployment trigger berhasil dikirim ke Dokploy."
